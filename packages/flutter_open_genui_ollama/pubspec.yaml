name: flutter_open_genui_ollama
description: >-
  Ollama adapter for flutter_open_genui — drive Flutter GenUI A2UI surfaces
  with a local LLM. No API key required.
version: 0.0.1
repository: https://github.com/devid/flutter_open_genui
issue_tracker: https://github.com/devid/flutter_open_genui/issues

environment:
  sdk: ^3.10.0
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_open_genui: ^0.0.1
  flutter_open_genui_openai: ^0.0.1
  genui: ^0.9.0
  dio: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
