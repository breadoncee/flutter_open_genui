name: flutter_open_genui
description: >-
  Bring your own LLM to Flutter GenUI. Shared core (adapter base class +
  resilient A2UI JSON healing) that provider adapters build on.
version: 0.0.1
repository: https://github.com/breadoncee/flutter_open_genui
issue_tracker: https://github.com/breadoncee/flutter_open_genui/issues

topics:
  - ai
  - llm
  - genui
  - generative-ui
  - a2ui

environment:
  sdk: ^3.10.0
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The A2UI Dart SDKs: a2ui_core for the protocol types, a2ui_agent for the
  # system prompt and for reading the model's streamed replies.
  a2ui_agent: ^0.2.0
  a2ui_core: ^0.6.0
  # ChatMessage and ChatMessageRole, which genui used to re-export.
  genai_primitives: ^0.2.3
  # Raw HTTP/SSE client shared by provider adapters (no community LLM SDKs).
  dio: ^5.0.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.0
