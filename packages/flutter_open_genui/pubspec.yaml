name: flutter_open_genui
description: >-
  Bring your own LLM to Flutter GenUI. Shared core (adapter base class +
  resilient A2UI JSON healing) that provider adapters build on.
version: 0.0.1
repository: https://github.com/devid/flutter_open_genui
issue_tracker: https://github.com/devid/flutter_open_genui/issues

environment:
  sdk: ^3.10.0
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The official Flutter GenUI SDK. Pinned to the verified alpha line; bump
  # deliberately because the API changes between alphas.
  genui: ^0.9.0
  # Raw HTTP/SSE client shared by provider adapters (no community LLM SDKs).
  dio: ^5.0.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.0
